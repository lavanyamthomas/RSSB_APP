server.port=8080
spring.application.name=rssb-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rssb_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:rssb@1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-change-this-to-a-long-random-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}
